apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-ai-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fastapi-ai-backend
  template:
    metadata:
      labels:
        app: fastapi-ai-backend
    spec:
      containers:
      - name: fastapi-ai-backend
        image: your-docker-repo/fastapi-ai-backend:latest
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef:
            name: fastapi-ai-backend-secrets
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "2Gi"
        volumeMounts:
        - name: log-volume
          mountPath: /app/logs
      volumes:
      - name: log-volume
        persistentVolumeClaim:
          claimName: fastapi-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-ai-backend
spec:
  selector:
    app: fastapi-ai-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: fastapi-ai-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: fastapi-ai-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fastapi-ai-backend-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - your-domain.com
    secretName: fastapi-ai-backend-tls
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: fastapi-ai-backend
            port:
              number: 80
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fastapi-logs-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi